spring.application.name=crud
server.port=${PORT:8081}

# O DataSource primário é resolvido automaticamente por DatabaseConfig.java:
# 0. DB_URL / DB_USERNAME / DB_PASSWORD (variáveis de ambiente - Docker/produção)
# 1. MySQL local (3307 / 3306) se disponível
# 2. H2 Persistente local (./data/claex_db) como fallback automático zero-config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------- Segredos: SEMPRE via variável de ambiente (nunca commitar valores reais)
gemini.api.key=${GEMINI_API_KEY:}

# ---------------- Segurança
claex.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8081,https://localhost,capacitor://localhost}
claex.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
claex.security.login.max-attempts-ip=${LOGIN_MAX_ATTEMPTS_IP:20}
claex.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
claex.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Cookie de sessão protegido contra leitura por JavaScript (XSS) e envio cross-site
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Não expõe stacktrace / mensagens internas nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}