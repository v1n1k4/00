spring.application.name=crud
server.port=8081

# O DataSource primário é resolvido automaticamente por DatabaseConfig.java:
# 1. MySQL local (3307 / 3306) se disponível
# 2. H2 Persistente local (./data/claex_db) como fallback automático zero-config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true